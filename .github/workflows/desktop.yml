name: Build application and script installer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Package separate Apple Silicon and Intel applications
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Create the version-pinned script installer
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          app_version=$(node -p "require('./package.json').version")
          release_tag="v${app_version}-${BUILD_COMMIT:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "STRUCTOGRAM_RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "STRUCTOGRAM_VERSION=$app_version" >> "$GITHUB_ENV"
          STRUCTOGRAM_RELEASE_TAG="$release_tag" npm run installer
          ditto -c -k --keepParent "release/Structogram Installer" "release/Structogram-Installer-${app_version}.zip"
      - name: Install through the script and launch the installed application
        run: |
          export STRUCTOGRAM_INSTALL_ROOT="$RUNNER_TEMP/Structogram installation test"
          export STRUCTOGRAM_PAYLOAD_CACHE="$PWD/release"
          ditto -x -k "release/Structogram-Installer-${STRUCTOGRAM_VERSION}.zip" "$RUNNER_TEMP/extracted installer"
          "$RUNNER_TEMP/extracted installer/Structogram Installer/Installation.command" --smoke-test
          bash "$RUNNER_TEMP/extracted installer/Structogram Installer/Installation.command" --verify-only
      - name: Publish the exact application payloads and installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          release_flags=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then release_flags+=(--prerelease); fi
          gh release create "$STRUCTOGRAM_RELEASE_TAG" --target "$RELEASE_COMMIT" --title "Structogram ADS $STRUCTOGRAM_VERSION" "${release_flags[@]}" --notes "Download Structogram-Installer-$STRUCTOGRAM_VERSION.zip, extract it, then double-click Installation.command or run bash ./Installation.command. The installer downloads the pinned application for your Mac."
          gh release upload "$STRUCTOGRAM_RELEASE_TAG" "release/Structogram-ADS-${STRUCTOGRAM_VERSION}-arm64.zip" "release/Structogram-ADS-${STRUCTOGRAM_VERSION}-x64.zip" "release/Structogram-Installer-${STRUCTOGRAM_VERSION}.zip"
      - name: Verify the public installer download without developer credentials
        run: |
          STRUCTOGRAM_INSTALL_ROOT="$RUNNER_TEMP/network installation test" STRUCTOGRAM_PAYLOAD_CACHE='' bash "$RUNNER_TEMP/extracted installer/Structogram Installer/Installation.command" --verify-only
      - uses: actions/upload-artifact@v4
        with:
          name: Structogram-Installer
          path: release/Structogram-Installer-*.zip
          if-no-files-found: error
          retention-days: 30
