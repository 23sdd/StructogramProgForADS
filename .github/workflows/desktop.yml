name: Build Mac application

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Package for Apple Silicon and Intel Macs
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Launch the packaged Mac application
        run: '"release/mac-universal/Structogram ADS.app/Contents/MacOS/Structogram ADS" --smoke-test'
      - uses: actions/upload-artifact@v4
        with:
          name: Structogram-ADS-Mac
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30
